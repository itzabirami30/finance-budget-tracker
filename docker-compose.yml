version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: finance-tracker-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: finance-tracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - finance-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance-tracker-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://root:password@mongodb:27017/finance-tracker?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - finance-network
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finance-tracker-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - finance-network
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm start

volumes:
  mongodb_data:

networks:
  finance-network:
    driver: bridge
